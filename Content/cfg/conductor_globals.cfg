# Conductor's own settings: Scribe's log folder and the web admin's port.
# One "key = value" a line, and "#" starts a comment.  Paths are
# relative to the Content folder unless they start with "/".
#
# Every setting in this file needs a HARD REBOOT to take: Conductor, the
# whole program, shut down and run again.  Edit it by hand while Conductor
# isn't running, or through the web admin, which holds the change in a
# .wait4server file beside it until Conductor shuts down.
#
# A line Conductor can't make sense of is logged and skipped, and that
# setting keeps its default.  A setting that isn't in the file at all is
# added to the end with its default the next time the file is read.

# The folder Scribe writes its logs into.  One file a day, named by the
# UTC date, rolling over at midnight UTC.
scribe_log_dir = logs

# The port the web admin listens on.  It only listens on 127.0.0.1, so it
# can't be reached from another machine.  Open http://127.0.0.1:<port>/Opus
# in a browser on this one.
wgui_port = 9996
