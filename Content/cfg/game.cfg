# The game world's settings.  One "key = value" a line, and "#" starts
# a comment.
#
# Every setting in this file needs a SOFT REBOOT to take: STOP SERVER and
# START SERVER (or RESTART SERVER) on the web admin's Control Panel.  The
# server reads it again every time it starts.  Edit it by hand with the
# server stopped, or through the web admin, which holds the change in a
# .wait4server file beside it until the server stops.
#
# A line Conductor can't make sense of is logged and skipped, and that
# setting keeps its default.  A setting that isn't in the file at all is
# added to the end with its default the next time the file is read.

# How big the world is, in steps of 1024 blocks a side, with 0,0,0 in
# the middle: 16 is 16384 blocks, -8192 to 8191 each way.  2 to 32.
# A change deletes the world on disk and makes a new one at the next
# START SERVER, dug chunks and all.  Omega's hills are held in memory
# whole: 134 MB at 16, 537 MB at 32.
world_size = 32

# How many chunks each way around a player the server loads.  A chunk
# is 32 m, so 4 is 128 m.  Every player starts at 0,0,0 for now, so
# today it's the chunks around there.
view_chunks = 8

# How often the world is saved, in seconds: every player's character as
# it stands at one moment, written to the database behind the game
# loop.  The first comes this long after the ground is in.  30 seconds
# to 30 minutes.  Leaving the world and STOP SERVER save too.
world_save_seconds = 1800

# How far past where a character could have walked a player's client
# may put it before the server pulls it back to its last good spot, in
# blocks.  Under 1 block is let go.  From 1 block up to this, the move
# stands and the bell gets a Warn; past it, the character is pulled
# back, with a Warn.  1 to 256.
movement_tolerance_blocks = 16
