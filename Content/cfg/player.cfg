# How a player's character handles.  One "key = value" a line, and "#"
# starts a comment.  Each player's client is told these as its character
# comes into the world, and the server holds a character to them.
#
# Every setting in this file needs a SOFT REBOOT to take: STOP SERVER and
# START SERVER (or RESTART SERVER) on the web admin's Server tab.  The
# server reads it again every time it starts.  Edit it by hand with the
# server stopped, or through the web admin, which holds the change in a
# .wait4server file beside it until the server stops.
#
# A line Conductor can't make sense of is logged and skipped, and that
# setting keeps its default.  A setting that isn't in the file at all is
# added to the end with its default the next time the file is read.

# How fast a character turns to face the way its player is walking it,
# in degrees a second.  450 is a half turn in 0.4 seconds.  A client
# that turns its character more than 90 degrees past this is pulled
# back, with a Warn.  90 to 3600.
turn_degrees_per_second = 450
