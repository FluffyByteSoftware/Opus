# The web admin's settings: the passwords of its two accounts.  One
# "key = value" a line, and "#" starts a comment.  The accounts are
# "user", who can look at everything and change nothing, and "admin", who
# can do everything.  The passwords are kept as they are, which is fine
# as long as the web admin only listens on this machine, which it does.
#
# Every setting in this file needs a HARD REBOOT to take: Conductor, the
# whole program, shut down and run again.  Edit it by hand while Conductor
# isn't running, or through the web admin, which holds the change in a
# .wait4server file beside it until Conductor shuts down.
#
# A line Conductor can't make sense of is logged and skipped, and that
# setting keeps its default.  A setting that isn't in the file at all is
# added to the end with its default the next time the file is read.

# The password for "user", the account that can look and not touch.
# It can't be empty.
user_password = user

# The password for "admin", the account that can start and stop the
# server, ACK notices, change settings and shut Conductor down.  It
# can't be empty.
admin_password = admin
