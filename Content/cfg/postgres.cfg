# Where Archivist finds Postgres, and how it runs.  One "key = value" a
# line, and "#" starts a comment.  It holds the database password, which
# is fine as long as Postgres only listens on this machine.
#
# Every setting in this file needs a SOFT REBOOT to take: STOP SERVER and
# START SERVER (or RESTART SERVER) on the web admin's Control Panel.  The
# server reads it again every time it starts.  Edit it by hand with the
# server stopped, or through the web admin, which holds the change in a
# .wait4server file beside it until the server stops.
#
# A line Conductor can't make sense of is logged and skipped, and that
# setting keeps its default.  A setting that isn't in the file at all is
# added to the end with its default the next time the file is read.

# The machine Postgres is on.
address = localhost

# The port Postgres listens on.
port = 5432

# The database Conductor uses.
database = opusdb

# The role Conductor logs in as.  It owns the game's tables.
username = opus_game

# The role's password, as it is, no quotes.
password = newpass

# Postgres cancels any query that runs longer than this many seconds, and
# the job comes back as an error.  0 means no limit.
query_time_limit_seconds = 10

# A job that takes at least this many milliseconds is logged as slow.
slow_job_ms = 250
