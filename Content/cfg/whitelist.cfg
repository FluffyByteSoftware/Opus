# The addresses let in at the login door, one a line: an address
# (1.2.3.4) or a range (1.2.3.0/24).  "#" starts a comment.  Only looked
# at while access_list in networking.cfg says whitelist; then nobody
# else gets in, and an empty list keeps everybody out.
#
# The web admin's Whitelist tab writes this file on every change, and
# takes the change at once.  A hand edit is read on the next START
# SERVER, and the next change from the page rewrites the file, so
# comments here don't last.

