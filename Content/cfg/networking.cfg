# Where Conductor listens for players, and how it treats them.  One
# "key = value" a line, and "#" starts a comment.  Paths are relative
# to the Content folder unless they start with "/".
#
# Every setting in this file needs a SOFT REBOOT to take: STOP SERVER and
# START SERVER (or RESTART SERVER) on the web admin's Control Panel.  The
# server reads it again every time it starts.  Edit it by hand with the
# server stopped, or through the web admin, which holds the change in a
# .wait4server file beside it until the server stops.
#
# A line Conductor can't make sense of is logged and skipped, and that
# setting keeps its default.  A setting that isn't in the file at all is
# added to the end with its default the next time the file is read.

# The address to listen on, for TCP and UDP both.  0.0.0.0 is every
# address this machine has; 127.0.0.1 is this machine only.
bind_address = 0.0.0.0

# The port players log in on, inside TLS.  The connection closes once
# the player has their ticket for UDP.
tcp_port = 9997

# The port the game runs on.  A player is told it with their ticket.
udp_port = 9998

# The TLS certificate, a PEM file.  Clients trust this one file and no
# authority.  Make it with openssl; the log says how when it's missing.
certificate_file = certs/conductor.crt

# The certificate's private key, a PEM file.  It never leaves this
# machine and never goes in git.
private_key_file = certs/conductor.key

# What a client has to say with its login.  Not a secret from anybody
# with a copy of the client; it turns port scanners away before they
# cost a hash.
secret_word = potato

# The client versions let in, separated by commas.  Any other is told
# "Outdated Client Failure" before its password is looked at.
client_versions = 0.0.1

# How long a connection gets to finish TLS and send its login before
# it's closed.  Time spent waiting in Security's line doesn't count.
login_deadline_seconds = 10

# How many logins can be in progress at once.  Security hashes one at
# a time whatever this says; the rest wait in its line.
login_threads = 8

# How many connections can wait for a login thread before new ones
# are turned away at the door.
max_waiting_logins = 64

# How long a ticket stays good if the client never shows up on UDP
# with it.
token_deadline_seconds = 30

# How long a player can go without sending anything over UDP before
# they're dropped.  Clients send a keep-alive every second.
udp_timeout_seconds = 40
