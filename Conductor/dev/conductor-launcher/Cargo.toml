# The program.  It starts the tools, the monitor and the web admin, and
# shuts down when the web admin says to.  A bin crate.

[package]
name = "conductor-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
conductor-monitor = { path = "../conductor-monitor" }
conductor-tools = { path = "../conductor-tools" }
conductor-wgui = { path = "../conductor-wgui" }
