# File:       Opus/Conductor/dev/conductor-launcher/Cargo.toml
# Component:  Conductor
# Author:     Jacob Chacko
#
# The program.  It starts the tools and the web admin, starts and stops the
# server when the web admin's Control Panel says to, and shuts down when
# SHUT DOWN is pressed there.  A bin crate.

[package]
name = "conductor-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
conductor-accounts = { path = "../conductor-accounts" }
conductor-monitor = { path = "../conductor-monitor" }
conductor-networking = { path = "../conductor-networking" }
conductor-tools = { path = "../conductor-tools" }
conductor-wgui = { path = "../conductor-wgui" }
