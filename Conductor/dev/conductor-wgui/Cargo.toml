# File:       Opus/Conductor/dev/conductor-wgui/Cargo.toml
# Component:  Conductor
# Author:     Jacob Chacko
#
# The web admin: a small web server on 127.0.0.1 that shows how Conductor is
# doing and is how the admin shuts it down.  A lib crate.  The web server is
# written on the standard library's TcpListener, so there's no crate for it.

[package]
name = "conductor-wgui"
version = "0.1.0"
edition = "2024"

[dependencies]
conductor-monitor = { path = "../conductor-monitor" }
conductor-tools = { path = "../conductor-tools" }
