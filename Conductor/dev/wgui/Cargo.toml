# File:       Opus/Conductor/dev/wgui/Cargo.toml
# Component:  Conductor
# Author:     Jacob Chacko
#
# The web admin: a small web server on 127.0.0.1 that shows how Conductor is
# doing and is how the admin shuts it down.  A lib crate.  The web server is
# written on the standard library's TcpListener, so there's no crate for it.
# conductor-networking is here for the Network Admin tabs: the door's
# ledger, the kick and the access lists.  conductor-accounts is here for the
# Accounts tab: the game's accounts, and the account desk.

[package]
name = "conductor-wgui"
version = "0.0.1"
edition = "2024"

[dependencies]
conductor-accounts = { path = "../accounts" }
conductor-monitor = { path = "../monitor" }
conductor-networking = { path = "../networking" }
conductor-tools = { path = "../tools" }
