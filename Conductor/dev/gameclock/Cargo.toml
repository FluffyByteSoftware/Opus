# File:       Opus/Conductor/dev/gameclock/Cargo.toml
# Component:  Conductor
# Author:     Jacob Chacko
#
# The GameClock: the game loop that owns the world and steps it forward,
# five checks of 50 ms to a 250 ms cycle.  A lib crate, and a server piece.
# Its folder is gameclock and its name is conductor-gameclock, like every
# crate, so code says conductor_gameclock.

[package]
name = "conductor-gameclock"
version = "0.1.0"
edition = "2024"

[dependencies]
conductor-primlib = { path = "../primlib" }
conductor-tools = { path = "../tools" }
