# File:       Opus/Conductor/dev/Cargo.toml
# Component:  Conductor
# Author:     Jacob Chacko
#
# The server, as a Cargo workspace.  conductor-tools is the lib everything
# else leans on, conductor-accounts is an account as the server holds it,
# conductor-monitor keeps an eye on the process, conductor-networking
# talks to players, conductor-lua-parser runs the Lua scripts,
# conductor-primlib is the game library, conductor-wgui is the web admin,
# and conductor-launcher is the program.
#
# The members are folders, named without the conductor- in front (tools,
# accounts, ...).  The crates keep it, so code still says conductor_tools.

[workspace]
members = ["tools", "accounts", "monitor", "networking", "lua-parser", "primlib", "wgui", "launcher"]
resolver = "3"
