# File:       Opus/Conductor/dev/tools/Cargo.toml
# Component:  Conductor
# Author:     Jacob Chacko
#
# The tools: DiskMan, Scribe, Constellations, Fingerprinter, Security,
# Archivist and the clock.  A lib crate.
#
# postgres is the blocking Postgres client.  Archivist runs it on a thread
# of its own, so blocking there never holds up anything else.
#
# argon2 is the password hash, for Security.  Its default features are off
# because the salt comes from Fingerprinter, not from the crate's own
# random source, so that side of it (and the crates behind it) stays out.
# "alloc" is for the fallback when a hash wants more memory than the arena
# holds, and "password-hash" is the PHC string format.
#
# pbkdf2 and sha2 make the password's key (PBKDF2 with HMAC-SHA256), the
# same way the client makes it, for Security's password_key().  The same
# people as argon2.  sha2 and hmac were already in the build through
# postgres.

[package]
name = "conductor-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
pbkdf2 = "0.13"
postgres = "0.19"
sha2 = "0.11"
