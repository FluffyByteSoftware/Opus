# File:       Opus/Conductor/dev/accounts/Cargo.toml
# Component:  Conductor
# Author:     Jacob Chacko
#
# Accounts: the one way in to the accounts table, and to the characters in
# player_characters and the account's slots for them.  An account is read from
# its row when it's needed and never held; a change goes straight back to the
# row.  The account desk, the web admin's jobs that need a password hashed, is
# here too, on a thread of its own.  A lib crate.  No dependencies but our own
# crates: the database goes through Archivist, the hash through Security, and
# the UUID comes from Fingerprinter, all in tools; primlib is here for the
# world save, whose copies are turned into Lua text on Archivist's thread.

[package]
name = "conductor-accounts"
version = "0.1.0"
edition = "2024"

[dependencies]
conductor-primlib = { path = "../primlib" }
conductor-tools = { path = "../tools" }
